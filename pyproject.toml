[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stemlab-open"
version = "0.1.4"
description = "Open-source multi-engine stem separation with RoFormer, Demucs, hybrid fusion, and adaptive spectral refinement"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  # Windows setup selects and verifies the backend-specific Torch wheel before
  # installing this project. Transitive Torch requirements are constrained by
  # scripts/win/windows-backend-constraints.txt so pip cannot replace it.
  "numpy>=1.26",
  "scipy>=1.12",
  "soundfile>=0.12",
  # Used directly on the audio path, so declared rather than leaned on as a
  # transitive dependency of librosa.
  "soxr>=0.3",
  "librosa>=0.11",
  # Resampling. Reached directly by beat_tracking and by the BS-RoFormer
  # rate alignment in pretrained.py; it arrives transitively through librosa
  # and beat-this today, which is not a guarantee worth a ModuleNotFoundError
  # at the user's first 48 kHz separation, after the model has loaded.
  "soxr>=0.3.2",
  "mido>=1.3",
  "beat-this==1.1.0",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "bs-roformer-infer>=0.1.4",
  "demucs>=4.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
recursive = ["audio-separator[gpu]==0.44.5"]

[project.scripts]
stemlab-separate = "stemlab.cli:separate_main"
stemlab-refine = "stemlab.cli:refine_main"
stemlab-models = "stemlab.cli:models_main"
stemlab-plugin-job = "stemlab.plugin_job:main"
stemlab-recursive-job = "stemlab.recursive_job:main"
stemlab-source-analysis = "stemlab.source_analysis:main"
stemlab-midi-job = "stemlab.midi:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["stemlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.per-file-ignores]
# Ableton loads this module inside Live and supplies dynamic API attributes that
# static lint rules cannot see.
"src/integrations/ableton/StemLabRemote/__init__.py" = ["ALL"]
