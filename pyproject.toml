[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stemlab-open"
version = "0.9.9"
description = "Open-source multi-engine stem separation with RoFormer, Demucs, hybrid fusion, and adaptive spectral refinement"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "torch>=2.4",
  "numpy>=1.26",
  "scipy>=1.12",
  "soundfile>=0.12",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "bs-roformer-infer>=0.1.4",
  "demucs>=4.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
stemlab-separate = "stemlab.cli:separate_main"
stemlab-refine = "stemlab.cli:refine_main"
stemlab-models = "stemlab.cli:models_main"
stemlab-plugin-job = "stemlab.plugin_job:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["stemlab*"]
